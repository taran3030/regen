name: Keep scanners current

# Every Monday: if nuclei has shipped a new release, open a PR that moves Regen's GitHub Action to it.
# (nuclei's detection templates already update on every run; this keeps the engine itself current.)
# Needs "Allow GitHub Actions to create and approve pull requests" on in the repo's Actions settings.

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  nuclei:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Look for a newer nuclei
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh api repos/projectdiscovery/nuclei/releases/latest --jq .tag_name | sed 's/^v//')
          current=$(grep -oE 'NUCLEI_VERSION: "[0-9.]+"' action.yml | grep -oE '[0-9.]+')
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "nuclei: pinned $current, latest $latest"
      - name: Open a PR
        if: steps.check.outputs.latest != steps.check.outputs.current
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.check.outputs.latest }}
          CURRENT: ${{ steps.check.outputs.current }}
        run: |
          set -euo pipefail
          branch="update/nuclei-$LATEST"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then echo "PR branch already exists"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          sed -i "s/NUCLEI_VERSION: \"$CURRENT\"/NUCLEI_VERSION: \"$LATEST\"/" action.yml
          git commit -am "Update nuclei to $LATEST"
          git push origin "$branch"
          gh pr create --title "Update nuclei to $LATEST" \
            --body "nuclei $LATEST is out (Regen pins $CURRENT). CI runs every check against the test servers on this PR." \
            --head "$branch" --base main
